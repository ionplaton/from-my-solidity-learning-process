name: Belot Android APK

on:
  push:
    paths:
      - "belot-android/**"
      - ".github/workflows/belot-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: belot-android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test game core
        run: ./gradlew --no-daemon :core:test

      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Rename APK
        run: |
          VERSION=$(grep versionName app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          cp app/build/outputs/apk/release/app-release.apk "belot-${VERSION}-build${{ github.run_number }}.apk"
          ls -la *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: belot-apk
          path: belot-android/belot-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: belot-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "Белот — сборка ${{ github.run_number }}"
          body: |
            Скачайте файл .apk на каждый телефон и установите его (разрешите установку из этого источника).
            Затем все телефоны подключаются к одной Wi‑Fi сети (или к точке доступа одного телефона): один нажимает «Создать стол» и выбирает 2, 3 или 4 игрока, остальные — «Присоединиться к столу».
          files: belot-android/belot-*.apk
          make_latest: true
